syntax = "proto3";

package grpc.auth.v1;

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
    string email = 1;
    string password = 2;
    string accessToken = 3;
    string refreshToken = 4;
}

service Auth {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}
